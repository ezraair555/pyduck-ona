[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyduck-ona"
version = "0.3.0"
description = "DuckDB-native People Analytics and Organizational Network Analysis (ONA) for HR data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "EzraAir555", email = "ezraair555@gmail.com"},
]
maintainers = [
    {name = "EzraAir555", email = "noreply@ezraair555.ai"},
]
keywords = [
    "duckdb", "hr", "people-analytics", "organizational-network-analysis",
    "ona", "hierarchy", "span-of-control", "duckpgq", "broom",
    "pyduck-janitor", "relational-api", "org-chart", "dashboard",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Human Resources Professionals",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "networkx>=3.2",
    "scipy>=1.11",
    "igraph>=0.11",
    "pandas>=2.0",
    "polars>=1.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
]
viz = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "plotly>=5.18",
    "pyvis>=0.3",
    "seaborn>=0.13",
]
graph = [
    # Optional DuckPGQ-backend extra. Installs DuckPGQ as a DuckDB community
    # extension (not a pip package), allowing the DuckPGQ-backed algorithms
    # in `pyduck_ona.graph` to dispatch against a DuckDB-native property
    # graph instead of the default NetworkX backend.
    #
    # ABI constraints:
    #   - DuckPGQ v1.3.1 (2025-07-15) is the last published community build.
    #     It is a C++ ABI-matched extension and DuckDB refuses cross-version
    #     loads, so this extra pins DuckDB to the exact matching runtime.
    #     Calling `pyduck_ona.graph.*` with `backend="duckpgq"` on other
    #     DuckDB versions raises `ImportError` with install instructions.
    #   - DuckPGQ is *not* in stock DuckDB core (verified on DuckDB 1.5.2).
    #     It still ships as a community extension from the DuckPGQ mirror.
    #
    # The default NetworkX backend requires no extra install.
    "duckdb==1.3.1",
]
# DuckPGQ itself is not a PyPI package — it is a DuckDB community extension.
# Install is handled at runtime by `pyduck_ona.graph.duckpgq_setup()` via the
# DuckPGQ mirror; see `graph/_duckpgq_backend.py` for the implementation.
stats = [
    "statsmodels>=0.14",
]
broom = [
    "broom-sm @ git+https://github.com/ezraair555/broom-sm",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "black>=24.0",
    "isort>=5.13",
    # pyduck-janitor is referenced as a future integration target but
    # is not on PyPI; install from GitHub so CI can resolve it.
    "pyduck-janitor @ git+https://github.com/ezraair555/pyduck-janitor@v0.1.2",
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/ezraair555/pyduck-ona"
Repository = "https://github.com/ezraair555/pyduck-ona"
Issues = "https://github.com/ezraair555/pyduck-ona/issues"
Documentation = "https://github.com/ezraair555/pyduck-ona#readme"
Changelog = "https://github.com/ezraair555/pyduck-ona/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyduck_ona*"]

[tool.setuptools.package-data]
pyduck_ona = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require duckpgq extension",
]
